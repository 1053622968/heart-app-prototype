<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5fb">
  <title>心脏+ - 心电图</title>
  <link rel="stylesheet" href="assets/app-shell.css?v=20260901-4">
  <link rel="stylesheet" href="assets/merged-nav.css">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #eceaf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .phone {
      position: relative;
      width: min(100vw, 375px);
      height: min(100dvh, 812px);
      min-height: 640px;
      overflow-y: auto;
      background: #f6f5fb;
      box-shadow: 0 18px 48px rgba(51, 44, 77, .18);
      scrollbar-width: none;
    }
    .phone::-webkit-scrollbar { display: none; }
    .detail-reference { display: block; width: 100%; height: auto; }
    .detail-back { position: absolute; z-index: 2; top: 44px; left: 8px; width: 42px; height: 42px; border-radius: 12px; }
    .detail-back:focus-visible { outline: 3px solid #64a8f0; outline-offset: -3px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 375px) {
      .phone { height: 100dvh; min-height: 100dvh; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="phone ecg-shell" aria-label="心电图详情">
    <a class="detail-back" href="record-lists.html?view=ecg&from=health" aria-label="返回心电图记录"></a>
    <h1 class="sr-only">心电图详情页面</h1>
    <img class="detail-reference" src="assets/ecg-detail-reference.png" alt="心电图详情页面">
  </main>
  
</body>
</html>
